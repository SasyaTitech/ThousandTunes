name: Practice release

# Pushing a practice tag (1.0.0-practice.6, no leading v) tests, builds and
# publishes the practice edition as a single portable exe. Tags that start
# with v belong to release.yml and the widget edition; the two never overlap.
#
# Built here rather than on a personal machine, so the binary carries no local
# paths and anyone can see exactly which commit it came from.
on:
  push:
    tags: ["*-practice.*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: The tag must match the practice version
        shell: bash
        run: |
          found=$(node -p "require('./src-tauri/tauri.practice.conf.json').version")
          if [ "$TAG" != "$found" ]; then
            echo "tag $TAG does not match tauri.practice.conf.json $found" >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # ci.yml only watches main, so a practice release checks itself.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install the browser
        run: npx playwright install chromium

      - name: Interface tests
        run: npm test

      - run: npm run build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build the practice edition
        run: npm run app:practice

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="ThousandTunes-$TAG-x64.exe"
          cp src-tauri/target/release/taktdock.exe "$asset"
          sha256sum "$asset" > "$asset.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
          else
            gh release create "$TAG" "$asset" "$asset.sha256" --verify-tag \
              --title "千曲 $TAG" \
              --notes "Windows x64, portable. Built by GitHub Actions from commit $GITHUB_SHA."
          fi
